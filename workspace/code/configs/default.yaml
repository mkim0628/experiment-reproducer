model:
  name: mistralai/Mistral-7B-Instruct-v0.2
  dtype: float16
  device: cuda

datasets:
  wikimqa:
    path: workspace/code/data/wikimqa_s.json
    n: 100
    metric: f1
  musique:
    path: workspace/code/data/musique_s.json
    n: 100
    metric: f1
  samsum:
    path: workspace/code/data/samsum.json
    n: 100
    metric: rouge_l

strategy:
  recompute_ratios: [0.05, 0.10, 0.15, 0.18]
  check_layer: 1
  num_chunks: null   # null => use whatever is in the bundled inputs
  # HKVD deviation tensor: "v" (matches official release; default), "k", "kv".
  # "k" and "kv" are ablations -- not what the paper reports.
  deviation_mode: v

generation:
  max_new_tokens: 32
  do_sample: false
  temperature: 0.0

output:
  results_dir: workspace/results

seed: 42
