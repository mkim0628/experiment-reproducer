model:
  name: mistralai/Mistral-7B-Instruct-v0.2
  dtype: float16
  device: cuda

datasets:
  wikimqa:
    path: workspace/code/data/wikimqa_s.json
    n: 200
    metric: f1
  musique:
    path: workspace/code/data/musique_s.json
    n: 200    # bundled file has 150; loader caps to available
    metric: f1
  samsum:
    path: workspace/code/data/samsum.json
    n: 200
    metric: rouge_l
  multinews:
    path: workspace/code/data/multinews.json
    n: 60               # paper's eval set size
    metric: rouge_l
    max_new_tokens: 200 # summaries are longer than QA answers
  # Extension datasets (Tier-1 multi-hop). Requires one-time fetch:
  #   python workspace/code/scripts/download_extra_datasets.py --which all
  hotpotqa:
    path: workspace/code/data/hotpotqa.json
    n: 200
    metric: f1
  multihop_rag:
    path: workspace/code/data/multihop_rag.json
    n: 200
    metric: f1
  hover:
    path: workspace/code/data/hover.json
    n: 200
    metric: claim_verification
  # NQ-Open with DPR top-20 passages (~130-token chunks). Built by
  # `scripts/build_nq_dpr_dataset.py` and committed under data/.
  nq_dpr:
    path: workspace/code/data/nq_dpr.json
    n: 200
    metric: f1

strategy:
  recompute_ratios: [0.05, 0.10, 0.15, 0.18]
  check_layer: 1
  num_chunks: null   # null => use whatever is in the bundled inputs
  # HKVD deviation tensor: "k" (this reproduction's default, ablation), "v"
  # (matches the official vllm_blend release and the paper's measured
  # numbers), or "kv" (sum of K and V squared-L2 reductions). Switch to "v"
  # for direct comparison with the paper.
  deviation_mode: k
  # HKVD ranking rule(s), evaluated as a grid alongside recompute_ratios.
  # "raw" = released CacheBlend (top-r% by raw KV deviation). "attn_weighted"
  # = Stage-1 candidate (deviation x attention mass). List both to compare the
  # accuracy/TTFT Pareto frontier in one run; drop to [raw] for the paper numbers.
  selection_modes: [raw, attn_weighted]
  # For selection="attn_weighted": query rows defining the attention mass --
  # "suffix" (cheap, R x T scores) or "all".
  mass_source: suffix

generation:
  max_new_tokens: 32
  do_sample: false
  temperature: 0.0

output:
  results_dir: workspace/results

seed: 42
