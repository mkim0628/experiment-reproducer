# Cerebrium config for the CacheBlend reproduction.
#
# Mirrors the cost-minimisation choices baked into run_eval_modal.py
# (see CLAUDE.md "Modal GPU cost rules" -- the same logic applies to any
# per-second GPU platform):
#
#   * compute = ADA_L4 -> cheapest 24 GB GPU that fits Mistral-7B fp16.
#     Only upgrade after a confirmed OOM (AMPERE_A10 -> AMPERE_A100_40GB -> ...).
#   * min_replicas = 0 + short cooldown -> no idle GPU billing once the run ends.
#   * HF weights are cached on the 50 GB persistent volume (/persistent-storage)
#     by main.py, so a re-run skips the ~14 GB Mistral download.
#   * one container loads the model once and runs the whole grid (the eval loop
#     lives inside a single function call, not one call per cell).
#
# Deploy / run from THIS directory (workspace/code/):
#   cerebrium login                                  # once
#   cerebrium secrets set HF_TOKEN <hf_xxx>          # once (gated Mistral repo)
#   cerebrium run main.py::run_cerebrium --mode smoke        # ephemeral, ~$0.05
#   cerebrium deploy                                 # persistent REST endpoint

[cerebrium.deployment]
name = "cacheblend-eval"
python_version = "3.11"
disable_auth = false
# Ship only code + configs. Datasets are NOT bundled: the JSONs total ~26 MB
# and `cerebrium run` caps the upload tar at 4 MB. Upload them once to the
# volume instead (main.py reads them from /persistent-storage/cacheblend-data):
#   cerebrium cp data/wikimqa_s.json cacheblend-data/wikimqa_s.json
#   cerebrium cp data/musique_s.json cacheblend-data/musique_s.json
#   cerebrium cp data/samsum.json    cacheblend-data/samsum.json
#   cerebrium cp data/nq_dpr.json    cacheblend-data/nq_dpr.json
include = [
    "main.py",
    "cerebrium.toml",
    "eval/*.py",
    "cacheblend/*.py",
    "configs/*.yaml",
    "scripts/*.py",
]
exclude = [
    ".*",
    "tests/*",
    "*.log",
    "__pycache__/*",
    "results/*",
    ".pytest_cache/*",
    "data/*",
]
shell_commands = []

[cerebrium.hardware]
cpu = 4
# 32 GB host RAM. 16 GB OOM-killed (exit 137) the long sweeps: Mistral-7B's CPU
# load footprint (~14 GB) plus the per-example CPU-side ChunkKVStore for long
# wikimqa contexts (a single ~8k-token context's KV is ~1 GB on CPU) exceeded
# 16 GB on later, longer examples -> kill + retry -> crash-loop. Short smokes fit
# (early examples are short), so this only bit the n>=50 runs. This is HOST RAM,
# not the L4's 24 GB VRAM, so it does not change the GPU tier / GPU cost.
memory = 32.0
# ADA_L4 = NVIDIA L4, 24 GB (Hobby+ plan). Cheapest GPU that fits Mistral-7B
# fp16 with KV-cache headroom. See CLAUDE.md before changing.
compute = "ADA_L4"
gpu_count = 1
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0          # never keep a GPU warm 24/7
max_replicas = 1          # one eval at a time; no accidental fan-out billing
replica_concurrency = 1
cooldown = 30             # scale the container down 30 s after the run ends
# The default grace period is 3600 s (1 h); the full 6-dataset grid can run
# ~2.5 h, so bump it. Hard cap is 12 h.
response_grace_period = 10800

[cerebrium.dependencies.pip]
# Same pins as run_eval_modal.py: transformers 5.8.1 + torch 2.7.x produced the
# reference reuse=0.215 / cacheblend=0.266 / recompute=0.271 numbers. PyPI's
# torch 2.7.1 wheel is CUDA-enabled, so no extra index URL is needed here.
torch = "==2.7.1"
transformers = "==5.8.1"
accelerate = ">=0.30"
rouge_score = ">=0.1.2"
numpy = "<2"
tqdm = "latest"
pyyaml = "latest"
cbor2 = "latest"
sentencepiece = "latest"
protobuf = "latest"
huggingface_hub = "latest"

[cerebrium.dependencies.apt]
git = "latest"
